# ╔══════════════════════════════════════════════════════════════╗
# ║                        tmux.conf                             ║
# ║        Pane/Tab modes · Neovim-ready · Catppuccin Frappe       ║
# ║                  AZERTY / Ghostty / macOS                    ║
# ╚══════════════════════════════════════════════════════════════╝

# ─── Général ──────────────────────────────────────────────────

# XDG (needed for lazygit etc. when launched from neovim's jobstart)
set-environment -g XDG_CONFIG_HOME "$HOME/.config"

# Préfixe : Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Numérotation à partir de 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Souris (scroll, clic, resize)
set -g mouse on

# Historique généreux
set -g history-limit 50000

# Pas de délai après Escape (crucial pour Neovim)
set -sg escape-time 0

# Forward focus events to Neovim (needed for autoread & gitsigns refresh)
set -g focus-events on

# Rafraîchir la status bar toutes les 5s (aussi la cadence de tmux-status-left)
set -g status-interval 5

# Activity monitoring is deliberately OFF. It flags a window on *any* output,
# so Claude Code and Neovim — which redraw constantly — kept it permanently lit
# and the flag meant nothing. Task completion is signalled by @task_status
# instead (see the window-status formats below), and "Claude is waiting" by its
# own Notification hook -> terminal-notifier.
set -g monitor-activity off
set -g visual-activity off

# Bell stays on: it fires on an actual BEL, which is rare enough to be a real
# signal rather than noise.
set -g monitor-bell on

# Mode vi pour le copy-mode
setw -g mode-keys vi

# Recharger la config
bind r source-file ~/.tmux.conf \; display "  Config rechargée !"


# ─── Couleurs / True Color (Neovim-ready) ────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Clipboard (OSC 52)
set -g set-clipboard on

# Pass through desktop notifications (OSC 9/777/99) from apps like Claude Code
set -g allow-passthrough on


# ─── Splits classiques (avec Prefix) ─────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %


# ═══════════════════════════════════════════════════════════════
#   MODES
#
#   Ctrl+a → p  →  Pane mode   (split, fermer, zoomer, naviguer)
#   Ctrl+a → t  →  Tab mode    (créer, fermer, renommer, naviguer)
#
#   Les deux sont "one-shot" : une action, retour au mode normal.
#   Le mode actif s'affiche dans la status bar à droite.
#
#   Il y avait aussi un Resize mode et un Move mode (sticky). Supprimés :
#   jamais utilisés en pratique, et le resize se fait à la souris en
#   tirant sur la bordure du pane.
# ═══════════════════════════════════════════════════════════════


# ─── PANE MODE (Prefix → p) ──────────────────────────────────
#
#   d = split down       r = split right      x = close
#   z = zoom             h/j/k/l = naviguer

bind p switch-client -T pane_mode

bind -T pane_mode d split-window -v -c "#{pane_current_path}"
bind -T pane_mode r split-window -h -c "#{pane_current_path}"
bind -T pane_mode x kill-pane
bind -T pane_mode z resize-pane -Z
bind -T pane_mode h select-pane -L
bind -T pane_mode j select-pane -D
bind -T pane_mode k select-pane -U
bind -T pane_mode l select-pane -R


# ─── TAB MODE (Prefix → t) ───────────────────────────────────
#
#   n = new tab          x = close tab        , = rename
#   h/l = prev/next      Tab = last used
#
#   Pas de 1-9 ici : c'était une copie exacte de Prefix + 1-9.

bind t switch-client -T tab_mode

bind -T tab_mode n   new-window -c "#{pane_current_path}"
bind -T tab_mode x   kill-window
bind -T tab_mode ,   command-prompt "rename-window '%%'"
bind -T tab_mode h   previous-window
bind -T tab_mode l   next-window
bind -T tab_mode Tab last-window


# ─── Raccourcis rapides (directement sous Prefix) ────────────

# Accès rapide aux tabs. Si le numéro dépasse le nombre de windows,
# on va sur la dernière au lieu de ne rien faire.
# (correct tant que `renumber-windows on` garde les index contigus)
bind 1 if-shell -F '#{>=:#{session_windows},1}' 'select-window -t 1' 'select-window -t "{end}"'
bind 2 if-shell -F '#{>=:#{session_windows},2}' 'select-window -t 2' 'select-window -t "{end}"'
bind 3 if-shell -F '#{>=:#{session_windows},3}' 'select-window -t 3' 'select-window -t "{end}"'
bind 4 if-shell -F '#{>=:#{session_windows},4}' 'select-window -t 4' 'select-window -t "{end}"'
bind 5 if-shell -F '#{>=:#{session_windows},5}' 'select-window -t 5' 'select-window -t "{end}"'
bind 6 if-shell -F '#{>=:#{session_windows},6}' 'select-window -t 6' 'select-window -t "{end}"'
bind 7 if-shell -F '#{>=:#{session_windows},7}' 'select-window -t 7' 'select-window -t "{end}"'
bind 8 if-shell -F '#{>=:#{session_windows},8}' 'select-window -t 8' 'select-window -t "{end}"'
bind 9 if-shell -F '#{>=:#{session_windows},9}' 'select-window -t 9' 'select-window -t "{end}"'

# Session picker (fzf dans un popup — voir scripts/tmux-sessions).
# Space et s font la même chose volontairement : Space est le raccourci de tous
# les jours, s reste par habitude.
#
# Pas de `switch-client -l` ici : ça ne fait qu'un aller-retour entre deux
# sessions (c'est le sens de « last »), et ça dépend de l'historique DU CLIENT —
# vide juste après un attach, donc le comportement changeait tout seul.
# Le picker est trié par usage récent : la session d'où l'on vient est en haut,
# donc Space puis Entrée remplace le toggle.
# 90%/80% et non 70%/60% comme les autres popups : l'aperçu affiche une capture
# de la fenêtre courante de la session survolée, à la géométrie du pane SOURCE.
# Impossible de reformater un TUI plein écran, donc la seule marge disponible est
# la taille du popup lui-même — chaque colonne gagnée ici est une colonne de plus
# avant la troncature.
bind s     display-popup -E -w 90% -h 80% "$HOME/.local/bin/tmux-sessions"
bind Space display-popup -E -w 90% -h 80% "$HOME/.local/bin/tmux-sessions"

# Task runner (voir scripts/tmux-tasks). Les tâches vivent dans `<projet>/.tmux/`
# et sont résolues depuis le répertoire de la SESSION (`#{session_path}`), pas
# celui du pane — donc `e` fait la même chose depuis n'importe quelle window.
#
# Le popup n'est ouvert QUE si le projet a au moins une tâche : sinon le script
# se fermerait aussitôt et on verrait un flash. `--check` fait ce test avant.
bind e if-shell "$HOME/.local/bin/tmux-tasks --check" \
  'display-popup -E -w 70% -h 60% "$HOME/.local/bin/tmux-tasks"' \
  'display-message -d 2000 "  no .tmux/ tasks in #{session_path}"'

# Window picker
bind w choose-tree -Zw

# Zoom rapide (sans passer par pane mode)
bind z resize-pane -Z

# Détacher
bind d detach-client


# ─── Copier depuis le terminal ───────────────────────────────
#
#   Prefix + v  →  copy-mode, puis SÉLECTIONNER À LA SOURIS.
#
# C'est LA façon de copier de façon fiable. En temps normal, un cliquer-glisser
# passe par ce binding tmux par défaut :
#
#   MouseDrag1Pane  if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
#                     { send-keys -M } { copy-mode -M }
#
# `mouse_any_flag` = « l'application de ce pane a demandé les événements
# souris ». Neovim l'active en permanence ; Claude Code l'active seulement
# quand il affiche une UI interactive (menus, prompts de sélection). Dans ces
# cas-là le glisser part dans l'application et tmux ne sélectionne rien — d'où
# le « des fois ça marche, des fois non ».
#
# Une fois DANS le copy-mode, la table copy-mode-vi prend la main et
# MouseDrag1Pane y est câblé directement sur begin-selection : l'application
# n'a plus son mot à dire. Le relâchement copie (copy-pipe-and-cancel → OSC 52
# → Ghostty, qui a clipboard-write = allow).
#
# Alternative sans tmux : Shift + glisser laisse Ghostty faire sa propre
# sélection (mouse-shift-capture = false). Pratique, mais Ghostty sélectionne
# par COLONNE d'écran — avec un split vertical on récupère les deux panes sur
# chaque ligne. Le copy-mode, lui, respecte les bordures de pane.
bind v copy-mode
bind [ copy-mode

# Prefix + u : attraper une URL / un chemin sans sélectionner (voir
# scripts/tmux-pick). C'est la réponse au « copier est pénible » dans 90 % des
# cas : ce qu'on veut attraper dans un terminal est presque toujours un token
# (URL, chemin), pas une région — donc autant sauter la sélection.
#
# #{pane_id} est passé explicitement : display-popup s'exécute côté CLIENT, et
# $TMUX_PANE dans le popup ne désigne pas de façon fiable le pane regardé.
bind u display-popup -E -w 80% -h 60% "$HOME/.local/bin/tmux-pick '#{pane_id}'"

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Scroll speed (défaut = 5 lignes, réduit à 2)
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down


# ─── Navigation entre panes : Ctrl+h/j/k/l ───────────────────
#
#   Sans prefix, et conscient de Neovim : si le pane fait tourner vim/nvim,
#   la touche lui est transmise (vim-tmux-navigator la récupère).

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"


# ─── Extended keys (nécessaire pour Shift+Enter avec ghostty) ──
# tmux décode la séquence CSI u de ghostty, puis le bind renvoie
# la même séquence \x1b[13;2u à l'application (Claude Code, etc.)
set -s extended-keys on
bind -n S-Enter send-keys Escape '[13;2u'


# ═══════════════════════════════════════════════════════════════
#   APPARENCE — Catppuccin Frappe
#
#   Règle : la barre est en niveaux de gris, SAUF là où la couleur
#   porte une information.
#
#     bleu #8caaee            « tu es ici »  (window active, bordure active)
#     jaune / vert / rouge    état d'une tâche  (● ✓ ✗ — voir tmux-tasks)
#
#   Rien d'autre n'est coloré. Avant, la session était bleue ET la window
#   active avait un fond vert : un ✓ vert dessus était invisible, et un ✗
#   rouge se battait avec le fond. La hiérarchie passe maintenant par le
#   TON (trois gris) et non par la teinte.
# ═══════════════════════════════════════════════════════════════

# ─── Status bar ───────────────────────────────────────────────

set -g status-position bottom
set -g status-justify left

# bg = #414559 (mantle), un cran SOUS le fond du terminal (#303446 / base).
# La barre recule derrière le contenu au lieu d'en faire partie.
set -g status-style 'bg=#414559 fg=#a5adce'

# Gauche : projet + branche, résolus par git (voir scripts/tmux-status-left).
# Pas le nom de session : grove le construit avec des '_' non réversibles, et
# il fige la branche au moment de la création — un `git checkout` plus tard et
# il ment. Le script porte ses propres styles.
#
# status-left-length est volontairement énorme : la troncature est faite DANS
# le script, parce que celle de tmux couperait au milieu d'un `#[fg=...]`.
set -g status-left '#[bg=#51576d]#($HOME/.local/bin/tmux-status-left "#{session_path}" "#{session_name}") #[bg=#414559,fg=#51576d]#[default] '
set -g status-left-length 200

# Droite : indicateur de mode (seul retour visuel qu'on est dans pane/tab mode)
# puis l'heure. Pas de date — le menu bar macOS l'a déjà.
# Le mode est en bleu, pas en jaune : le jaune est réservé à « tâche en cours ».
set -g status-right '#{?#{!=:#{client_key_table},root},#[fg=#8caaee#,bold]#{client_key_table}   ,}#[fg=#a5adce]%H:%M '
set -g status-right-length 60

# @task_status is set by scripts/tmux-task-run on windows owned by a tmux task
# (see scripts/tmux-tasks). Three states, and it persists until the task is
# re-run — so a failure you walked away from is still there when you come back.
#   ● running   ✓ success   ✗ failure
# Same markers on active and inactive windows: they are the only coloured thing
# in the window list now, so nothing swallows them.
#
# Window active : pastille bleue pleine. Le soulignement seul (essai précédent)
# était trop discret à cette taille de police, et il mettait la window active au
# même niveau visuel que la branche à gauche.
#
# Les marqueurs de tâche sont volontairement HORS de la pastille : sur un fond
# bleu, un ✗ rouge devient illisible. Posés sur le fond de barre, les trois
# couleurs gardent leur contraste, que la window soit active ou non.
setw -g window-status-current-style 'fg=#c6d0f5'
setw -g window-status-current-format '#[fg=#8caaee,bg=#414559]#[bg=#8caaee,fg=#414559,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[bg=#414559,fg=#8caaee,nobold]#{?#{==:#{@task_status},running},#[fg=#e5c890] ●,#{?#{==:#{@task_status},ok},#[fg=#a6d189] ✓,#{?#{==:#{@task_status},fail},#[fg=#e78284] ✗,}}}#[default] '

# Windows inactives : gris moyen. #838ba7 sur #303446 donnait ~2.3:1 de
# contraste — illisible ; #a5adce sur #414559 est à ~5:1, clairement
# secondaire mais lisible.
setw -g window-status-style 'fg=#a5adce'
setw -g window-status-format ' #[fg=#737994]#I #[fg=#a5adce]#W#{?window_zoomed_flag, 󰊓,}#{?#{==:#{@task_status},running},#[fg=#e5c890] ●,#{?#{==:#{@task_status},ok},#[fg=#a6d189] ✓,#{?#{==:#{@task_status},fail},#[fg=#e78284] ✗,}}}  '

# Pas de séparateur — l'espacement fait le travail
setw -g window-status-separator ''

# Claude Code s'installe dans ~/.local/share/claude/versions/<version>, donc
# `pane_current_command` vaut « 2.1.220 » et la window s'appelait comme ça.
# On remappe tout nom qui n'est qu'un numéro de version vers « claude ».
setw -g automatic-rename-format '#{?#{m/r:^[0-9]+(\.[0-9]+)+$,#{pane_current_command}},claude,#{pane_current_command}}'

# ─── Panes ────────────────────────────────────────────────────

set -g pane-border-indicators arrows
set -g pane-border-style 'fg=#51576d'
set -g pane-active-border-style 'fg=#8caaee'

# ─── Messages ─────────────────────────────────────────────────

set -g message-style 'fg=#c6d0f5 bg=#51576d bold'
set -g message-command-style 'fg=#c6d0f5 bg=#51576d'

# ─── Sélection copy mode ─────────────────────────────────────

setw -g mode-style 'fg=#303446 bg=#f4b8e4 bold'


# Cheat sheet popup — extrait le bloc ci-dessous jusqu'au séparateur de fin.
# Le motif est ancré sur '^#' pour que cette ligne-ci ne matche pas elle-même.
# C'est la SEULE aide : les popups `?` par mode ont été supprimés, ils
# dupliquaient ce bloc sans que rien ne garde les copies synchronisées.
bind ? display-popup -w 66 -h 22 "sed -n '/^#   CHEAT SHEET/,/^# ═/p' ~/.tmux.conf | sed 's/^#//'"

# ═══════════════════════════════════════════════════════════════
#   CHEAT SHEET
#
#   Ctrl+a → 1-9   Aller au tab N  (N > count → dernier tab)
#   Ctrl+a → p     Pane mode     d/r = split, x = close, z = zoom, hjkl
#   Ctrl+a → t     Tab mode      n = new, x = close, , = rename, h/l, Tab
#
#   Ctrl+a → u     Attraper une URL / un chemin de l'écran (fzf, sans sélection)
#   Ctrl+a → v     Copy mode — puis sélection À LA SOURIS, relâcher = copié
#                  (Shift + glisser = sélection Ghostty, ignore les splits)
#   Ctrl+a → Space Session picker — trié par usage récent
#   Ctrl+a → e     Task picker — scripts de <projet>/.tmux/
#   Ctrl+a → w     Window picker
#   Ctrl+a → z     Zoom pane
#   Ctrl+a → d     Detach
#   Ctrl+a → r     Reload config
#   Ctrl+a → | -   Split right / down
#
#   Ctrl+hjkl      Naviguer entre panes (direct, sans prefix)
#
#   Dans la barre :  ● tâche en cours   ✓ réussie   ✗ échouée
# ═══════════════════════════════════════════════════════════════

# ╔══════════════════════════════════════════════════════════════╗
# ║                        tmux.conf                            ║
# ║     Zellij-style modes · Neovim-ready · Catppuccin Mocha    ║
# ║                  AZERTY / Ghostty / macOS                   ║
# ╚══════════════════════════════════════════════════════════════╝

# ─── Général ──────────────────────────────────────────────────

# XDG (needed for lazygit etc. when launched from neovim's jobstart)
set-environment -g XDG_CONFIG_HOME "$HOME/.config"

# Préfixe : Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Numérotation à partir de 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Souris (scroll, clic, resize)
set -g mouse on

# Historique généreux
set -g history-limit 50000

# Pas de délai après Escape (crucial pour Neovim)
set -sg escape-time 0

# Forward focus events to Neovim (needed for autoread & gitsigns refresh)
set -g focus-events on

# Temps pour enchaîner les raccourcis repeat (-r)
set -g repeat-time 600

# Rafraîchir la status bar toutes les 5s
set -g status-interval 5

# Activity / bell monitoring (highlight window in status bar)
set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on

# Mode vi pour le copy-mode
setw -g mode-keys vi

# Recharger la config
bind r source-file ~/.tmux.conf \; display "  Config rechargée !"


# ─── Couleurs / True Color (Neovim-ready) ────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Clipboard (OSC 52)
set -g set-clipboard on

# Pass through desktop notifications (OSC 9/777/99) from apps like Claude Code
set -g allow-passthrough on


# ─── Splits classiques (avec Prefix) ─────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %


# ═══════════════════════════════════════════════════════════════
#   MODES ZELLIJ-STYLE
#
#   Ctrl+a → p  →  Pane mode    (créer, naviguer, fermer)
#   Ctrl+a → t  →  Tab mode     (créer, naviguer, fermer)
#   Ctrl+a → R  →  Resize mode  (sticky — Escape pour sortir)
#   Ctrl+a → m  →  Move mode    (sticky — Escape pour sortir)
#
#   Les modes Pane et Tab sont "one-shot" : une action, retour.
#   Les modes Resize et Move sont "sticky" : on enchaîne.
#
#   Le mode actif s'affiche dans la status bar à droite.
# ═══════════════════════════════════════════════════════════════


# ─── PANE MODE (Prefix → p) ──────────────────────────────────
#
#   d = split down       r = split right      x = close
#   h/j/k/l = naviguer   z = zoom             Tab = next
#   ! = envoyer dans sa propre window
#   Space = changer le layout

bind p switch-client -T pane_mode

bind -T pane_mode d     split-window -v -c "#{pane_current_path}"
bind -T pane_mode r     split-window -h -c "#{pane_current_path}"
bind -T pane_mode x     kill-pane
bind -T pane_mode z     resize-pane -Z
bind -T pane_mode !     break-pane
bind -T pane_mode h     select-pane -L
bind -T pane_mode j     select-pane -D
bind -T pane_mode k     select-pane -U
bind -T pane_mode l     select-pane -R
bind -T pane_mode Up    select-pane -U
bind -T pane_mode Down  select-pane -D
bind -T pane_mode Left  select-pane -L
bind -T pane_mode Right select-pane -R
bind -T pane_mode Tab   select-pane -t :.+
bind -T pane_mode Space next-layout
bind -T pane_mode ? display-popup -w 50 -h 12 "echo '  PANE MODE\n\n  d = split down        r = split right\n  x = close             z = zoom\n  h/j/k/l = navigate    Tab = next\n  ! = break to window   Space = layout\n  ? = this help'"


# ─── TAB MODE (Prefix → t) ───────────────────────────────────
#
#   n = new tab          x = close tab        , = rename
#   m = move tab to pos  h/l = prev/next      Tab = last used
#   1-9 = aller au tab N

bind t switch-client -T tab_mode

bind -T tab_mode n     new-window -c "#{pane_current_path}"
bind -T tab_mode x     kill-window
bind -T tab_mode ,     command-prompt "rename-window '%%'"
bind -T tab_mode h     previous-window
bind -T tab_mode l     next-window
bind -T tab_mode Left  previous-window
bind -T tab_mode Right next-window
bind -T tab_mode m     command-prompt "move-window -t '%%'"
bind -T tab_mode Tab   last-window
bind -T tab_mode 1     select-window -t 1
bind -T tab_mode 2     select-window -t 2
bind -T tab_mode 3     select-window -t 3
bind -T tab_mode 4     select-window -t 4
bind -T tab_mode 5     select-window -t 5
bind -T tab_mode 6     select-window -t 6
bind -T tab_mode 7     select-window -t 7
bind -T tab_mode 8     select-window -t 8
bind -T tab_mode 9     select-window -t 9
bind -T tab_mode ? display-popup -w 50 -h 11 "echo '  TAB MODE\n\n  n = new tab           x = close tab\n  , = rename            m = move to pos\n  h/l = prev/next       Tab = last used\n  1-9 = jump to tab N\n  ? = this help'"


# ─── RESIZE MODE (Prefix → R) — sticky ───────────────────────
#
#   h/j/k/l ou flèches = redimensionner (pas de 2)
#   H/J/K/L = redimensionner (pas de 5, plus rapide)
#   Escape ou Entrée = sortir

bind R switch-client -T resize_mode

bind -T resize_mode h     resize-pane -L 2 \; switch-client -T resize_mode
bind -T resize_mode j     resize-pane -D 2 \; switch-client -T resize_mode
bind -T resize_mode k     resize-pane -U 2 \; switch-client -T resize_mode
bind -T resize_mode l     resize-pane -R 2 \; switch-client -T resize_mode
bind -T resize_mode Left  resize-pane -L 2 \; switch-client -T resize_mode
bind -T resize_mode Right resize-pane -R 2 \; switch-client -T resize_mode
bind -T resize_mode Up    resize-pane -U 2 \; switch-client -T resize_mode
bind -T resize_mode Down  resize-pane -D 2 \; switch-client -T resize_mode
bind -T resize_mode H     resize-pane -L 5 \; switch-client -T resize_mode
bind -T resize_mode J     resize-pane -D 5 \; switch-client -T resize_mode
bind -T resize_mode K     resize-pane -U 5 \; switch-client -T resize_mode
bind -T resize_mode L     resize-pane -R 5 \; switch-client -T resize_mode
bind -T resize_mode ? display-popup -w 50 -h 11 "echo '  RESIZE MODE (sticky)\n\n  h/j/k/l = resize (step 2)\n  H/J/K/L = resize (step 5)\n  arrows  = resize (step 2)\n  Escape  = exit\n  ? = this help'"


# ─── MOVE MODE (Prefix → m) — sticky ─────────────────────────
#
#   h/j/k/l ou flèches = déplacer le pane
#   Escape = sortir

bind m switch-client -T move_mode

# swap-pane -U/-D ne suit que l'ordre des panes, pas la géométrie : h et k
# faisaient tous les deux -U, j et l tous les deux -D, donc les échanges
# horizontaux ne marchaient pas. {left-of} & co. ciblent le pane voisin
# dans la direction réelle.
bind -T move_mode h     swap-pane -s '{left-of}'  \; switch-client -T move_mode
bind -T move_mode j     swap-pane -s '{down-of}'  \; switch-client -T move_mode
bind -T move_mode k     swap-pane -s '{up-of}'    \; switch-client -T move_mode
bind -T move_mode l     swap-pane -s '{right-of}' \; switch-client -T move_mode
bind -T move_mode Left  swap-pane -s '{left-of}'  \; switch-client -T move_mode
bind -T move_mode Right swap-pane -s '{right-of}' \; switch-client -T move_mode
bind -T move_mode Up    swap-pane -s '{up-of}'    \; switch-client -T move_mode
bind -T move_mode Down  swap-pane -s '{down-of}'  \; switch-client -T move_mode
bind -T move_mode ? display-popup -w 50 -h 10 "echo '  MOVE MODE (sticky)\n\n  h/j/k/l = swap pane\n  arrows  = swap pane\n  Escape  = exit\n  ? = this help'"


# ─── Raccourcis rapides (directement sous Prefix) ────────────

# Accès rapide aux tabs
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Naviguer entre windows sans passer par tab mode.
# -r = répétable : Prefix h  puis  h h h  pour enchaîner (repeat-time 600).
bind -r h previous-window
bind -r l next-window
bind Space last-window

# Scroll / copy mode
bind [ copy-mode

# Zoom rapide (sans passer par pane mode)
bind z resize-pane -Z

# Détacher
bind d detach-client


# ─── SESSIONS (une par worktree, via grove) ──────────────────
#
#   Le point clé : switch-client, PAS attach-session. attach-session
#   refuse de tourner depuis une session existante ("sessions should be
#   nested with care"), c'est pour ça qu'il fallait ouvrir un nouvel
#   onglet. switch-client bascule le client courant, sur place.
#
#   s     = menu des sessions (numéroté)
#   S     = choose-tree complet (fallback)
#   Tab   = session précédente (ping-pong)
#   ( )   = session précédente / suivante, répétable

bind s run-shell -b "$HOME/.local/bin/tmux-session-menu '#{client_name}'"
bind S choose-tree -Zs
bind Tab switch-client -l
bind -r ( switch-client -p
bind -r ) switch-client -n

# Menu de TOUTES les windows de TOUTES les sessions : sauter directement
# sur la fenêtre nvim d'un autre worktree, en une action.
bind w run-shell -b "$HOME/.local/bin/tmux-window-menu '#{client_name}'"
bind W choose-tree -Zw


# ─── Copy mode (vi-style) ────────────────────────────────────

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Scroll speed (défaut = 5 lignes, réduit à 2)
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down


# ─── Navigation entre panes : Ctrl+h/j/k/l ───────────────────
#
#   Fonctionne sans prefix, navigation directe.
#   Quand tu installeras Neovim + vim-tmux-navigator,
#   commente le BLOC 1 et décommente le BLOC 2.

# BLOC 1 — Sans Neovim (inactif)
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# BLOC 2 — Avec Neovim (actif)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"


# ─── Navigation entre windows : Alt+… (sans prefix) ──────────
#
#   Ctrl+hjkl = panes, Alt+hl = windows. Même geste, un cran au-dessus.
#   Nécessite `macos-option-as-alt = left` dans ghostty (l'Option droite
#   continue de taper { } [ ] | \ normalement).
#
#   Si un jour ça entre en conflit avec un mapping Neovim, commenter ce
#   bloc suffit : tout est aussi accessible sous Prefix.

bind -n M-h previous-window
bind -n M-l next-window
bind -n M-o last-window
bind -n M-s run-shell -b "$HOME/.local/bin/tmux-session-menu '#{client_name}'"
bind -n M-w run-shell -b "$HOME/.local/bin/tmux-window-menu '#{client_name}'"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ─── Extended keys (nécessaire pour Shift+Enter avec ghostty) ──
# tmux décode la séquence CSI u de ghostty, puis le bind renvoie
# la même séquence \x1b[13;2u à l'application (Claude Code, etc.)
set -s extended-keys on
bind -n S-Enter send-keys Escape '[13;2u'

# ═══════════════════════════════════════════════════════════════
#   APPARENCE — Catppuccin Mocha
# ═══════════════════════════════════════════════════════════════

# ─── Status bar ───────────────────────────────────────────────

set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# Deux lignes : les sessions au-dessus, les windows en-dessous.
#
# Sur une seule ligne, 5 worktrees mangeaient ~95 colonnes et la liste
# des windows se retrouvait écrasée en "<1:cc>". Les deux niveaux ne se
# disputent plus la place : rien n'est tronqué, pour une ligne de terminal.
set -g status 2

# Ligne du haut : TOUTES les sessions, la courante surlignée.
#
# Avec une session par worktree, voir seulement #S rendait les autres
# invisibles — d'où le réflexe d'ouvrir un onglet. La boucle #{S:...}
# les liste toutes.
#
# Les noms sont raccourcis pour tenir : grove nomme ses sessions
# "grove_<projet>_<branche>_<clé>", on retire le préfixe et la clé
# (4 hex) → "bp-api_main". Les virgules littérales sont échappées en #,
# car #{?...} s'en sert comme séparateur.
set -g status-left '#[fg=#585b70,bg=#1e1e2e] 󱂬 #{S:#{?#{==:#{session_name},#{client_session}},#[fg=#1e1e2e#,bg=#89b4fa#,bold] ,#[fg=#7f849c#,bg=#313244] }#{s/_[0-9a-f][0-9a-f][0-9a-f][0-9a-f]$//:#{s/^grove_//:session_name}} #[fg=#cdd6f4#,bg=#1e1e2e] }'
set -g status-left-length 200
set -g status-format[0] '#[align=left]#{T;=/#{status-left-length}:status-left}'

# Ligne du bas : les windows de la session courante, puis le mode et l'heure.
# Les #[range=window|...] gardent le clic souris sur les onglets.
set -g status-format[1] '#[align=left list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}]#{T:window-status-format}#[norange default],#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#{T:window-status-current-format}#[norange list=on default]}#[nolist align=right]#{T:status-right}'

# Droite : indicateur de mode (comme Zellij !) + heure
set -g status-right '#{?#{!=:#{client_key_table},root},#[fg=#1e1e2e#,bg=#f9e2af#,bold]  #{client_key_table} #[default] ,}#[fg=#6c7086] %H:%M  %d/%m '
set -g status-right-length 60

# Window active
setw -g window-status-current-style 'fg=#1e1e2e bg=#a6e3a1 bold'
setw -g window-status-current-format '  #I:#W#{?window_zoomed_flag, 󰊓,} '

# Windows inactives — • = activité, ! = bell (utile quand Claude finit
# dans une autre window)
setw -g window-status-style 'fg=#6c7086'
setw -g window-status-format '  #I:#W#{?window_bell_flag,#[fg=#f38ba8] !,#{?window_activity_flag,#[fg=#f9e2af] •,}} '

# Le marqueur (• / !) suffit : sans ça tmux inverse en plus tout l'onglet,
# ce qui donnait un gros bloc gris sur la moitié de la barre.
setw -g window-status-activity-style 'none'
setw -g window-status-bell-style 'none'

# Pas de séparateur
setw -g window-status-separator ''

# ─── Panes ────────────────────────────────────────────────────

set -g pane-border-indicators arrows
set -g pane-border-lines single
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Le pane inactif s'estompe légèrement : on voit où on tape sans avoir
# à chercher la bordure.
set -g window-style 'fg=#9399b2'
set -g window-active-style 'fg=#cdd6f4'

# ─── Menus & popups ──────────────────────────────────────────
#
# Par défaut tmux dessine ses menus en blanc sur noir avec des angles
# droits — c'est ce qui fait "vieille école". Coins arrondis + palette
# Catppuccin les alignent sur le reste.

set -g menu-style          'fg=#cdd6f4 bg=#181825'
set -g menu-selected-style 'fg=#1e1e2e bg=#89b4fa bold'
set -g menu-border-style   'fg=#585b70'
set -g menu-border-lines   rounded

set -g popup-style         'bg=#181825'
set -g popup-border-style  'fg=#585b70'
set -g popup-border-lines  rounded

# ─── Messages ─────────────────────────────────────────────────

set -g message-style 'fg=#1e1e2e bg=#89b4fa bold'
set -g message-command-style 'fg=#cdd6f4 bg=#313244'

# ─── Sélection copy mode ─────────────────────────────────────

setw -g mode-style 'fg=#1e1e2e bg=#f5c2e7 bold'


# Cheat sheet popup
# Le motif est ancré sur '^#' : sinon grep matche d'abord cette ligne-ci,
# qui contient elle aussi la chaîne CHEAT SHEET, et le popup est décalé.
bind ? display-popup -w 66 -h 30 "grep -A 27 '^#   CHEAT SHEET' ~/.tmux.conf | tail -n +2 | head -26 | sed 's/^#//'"

# ═══════════════════════════════════════════════════════════════
#   CHEAT SHEET
#
#   SESSIONS (une par worktree)
#   Ctrl+a → s    Session menu (numéroté)      Alt+s
#   Ctrl+a → Tab  Session précédente
#   Ctrl+a → ( )  Session préc. / suiv.
#   Ctrl+a → S    choose-tree complet
#
#   WINDOWS
#   Alt+h / Alt+l      Window préc. / suiv.    (sans prefix)
#   Alt+1-9            Aller à la window N     (sans prefix)
#   Alt+o              Dernière window         (sans prefix)
#   Ctrl+a → h / l     Window préc. / suiv.    (répétable)
#   Ctrl+a → Space     Dernière window
#   Ctrl+a → w         Menu toutes windows / toutes sessions
#
#   MODES
#   Ctrl+a → p    Pane mode     d/r/x/z/hjkl/Tab/Space/!
#   Ctrl+a → t    Tab mode      n/x/,/m/hjkl/1-9/Tab
#   Ctrl+a → R    Resize mode   hjkl (sticky, Esc to exit)
#   Ctrl+a → m    Move mode     hjkl (sticky, Esc to exit)
#
#   DIVERS
#   Ctrl+hjkl     Panes (sans prefix, Neovim-aware)
#   Ctrl+a → z    Zoom       Ctrl+a → [    Copy mode
#   Ctrl+a → |    Split right   Ctrl+a → -    Split down
#   Ctrl+a → d    Detach     Ctrl+a → r    Reload
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
#   PLUGINS (TPM)
#
#   Les sessions worktree survivent à un reboot / crash de ghostty.
#   Bootstrap : install.sh clone TPM. Prefix+I pour installer,
#   Prefix+U pour mettre à jour.
# ═══════════════════════════════════════════════════════════════

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restaurer le contenu des panes et les processus qu'on veut relancer.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Sauvegarde auto toutes les 15 min + restauration au démarrage du serveur.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Doit rester la DERNIÈRE ligne du fichier.
run '~/.tmux/plugins/tpm/tpm'

# ─── Général ──────────────────────────────────────────────────

# lazygit and friends need this when launched from neovim's jobstart, which does
# not inherit the shell's environment.
set-environment -g XDG_CONFIG_HOME "$HOME/.config"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g status-interval 5

set -g monitor-activity off
set -g visual-activity off
set -g monitor-bell on

# Killing the last window of a session switches to another session instead of
# ejecting the client out of tmux.
set -g detach-on-destroy off

setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "  Config rechargée !"


# ─── Couleurs / True Color (Neovim-ready) ────────────────────

set -g default-terminal "tmux-256color"

# `set -a` on an array option APPENDS, so a plain `set -as` here grows the array
# by one entry on every Prefix + r — the live server had reached 52 duplicated
# entries. `set -gu` first resets the option to its default array (which carries
# the stock xterm*:clipboard:ccolour:cstyle:focus:title), so the pair below is
# idempotent across reloads.
#
# usstyle = coloured/styled underlines (nvim LSP undercurl), sync = DECSET 2026
# synchronized output. Ghostty's TERM outside tmux is xterm-ghostty.
set -gu terminal-features
set -as terminal-features ",xterm-ghostty:RGB:usstyle:sync"
set -as terminal-features ",xterm-256color:RGB:usstyle:sync"

set -g set-clipboard on

# OSC 9/777/99 desktop notifications from apps like Claude Code
set -g allow-passthrough on


# ─── Splits classiques (avec Prefix) ─────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %


# ═══════════════════════════════════════════════════════════════
#   MODES
#
#   Ctrl+a → p  →  Pane mode   (split, fermer, zoomer, naviguer)
#   Ctrl+a → t  →  Tab mode    (créer, fermer, renommer, naviguer)
#
#   Les deux sont "one-shot" : une action, retour au mode normal.
#   Le mode actif s'affiche dans la status bar à droite.
# ═══════════════════════════════════════════════════════════════


# ─── PANE MODE (Prefix → p) ──────────────────────────────────

bind p switch-client -T pane_mode

bind -T pane_mode d split-window -v -c "#{pane_current_path}"
bind -T pane_mode r split-window -h -c "#{pane_current_path}"
bind -T pane_mode x kill-pane
bind -T pane_mode z resize-pane -Z
bind -T pane_mode h select-pane -L
bind -T pane_mode j select-pane -D
bind -T pane_mode k select-pane -U
bind -T pane_mode l select-pane -R


# ─── TAB MODE (Prefix → t) ───────────────────────────────────

bind t switch-client -T tab_mode

bind -T tab_mode n   new-window -c "#{pane_current_path}"
bind -T tab_mode x   kill-window
bind -T tab_mode ,   command-prompt "rename-window '%%'"
bind -T tab_mode h   previous-window
bind -T tab_mode l   next-window
bind -T tab_mode Tab last-window


# ─── Raccourcis rapides (directement sous Prefix) ────────────

bind 1 if-shell -F '#{>=:#{session_windows},1}' 'select-window -t 1' 'select-window -t "{end}"'
bind 2 if-shell -F '#{>=:#{session_windows},2}' 'select-window -t 2' 'select-window -t "{end}"'
bind 3 if-shell -F '#{>=:#{session_windows},3}' 'select-window -t 3' 'select-window -t "{end}"'
bind 4 if-shell -F '#{>=:#{session_windows},4}' 'select-window -t 4' 'select-window -t "{end}"'
bind 5 if-shell -F '#{>=:#{session_windows},5}' 'select-window -t 5' 'select-window -t "{end}"'
bind 6 if-shell -F '#{>=:#{session_windows},6}' 'select-window -t 6' 'select-window -t "{end}"'
bind 7 if-shell -F '#{>=:#{session_windows},7}' 'select-window -t 7' 'select-window -t "{end}"'
bind 8 if-shell -F '#{>=:#{session_windows},8}' 'select-window -t 8' 'select-window -t "{end}"'
bind 9 if-shell -F '#{>=:#{session_windows},9}' 'select-window -t 9' 'select-window -t "{end}"'

# 90%/80% et non 70%/60% comme les autres popups : l'aperçu affiche une capture
# de la fenêtre courante de la session survolée, à la géométrie du pane SOURCE.
# Impossible de reformater un TUI plein écran, donc la seule marge disponible est
# la taille du popup lui-même.
bind s     display-popup -E -w 90% -h 80% "$HOME/.local/bin/tmux-sessions"
bind Space display-popup -E -w 90% -h 80% "$HOME/.local/bin/tmux-sessions"

bind e if-shell "$HOME/.local/bin/tmux-tasks --check" \
  'display-popup -E -w 70% -h 60% "$HOME/.local/bin/tmux-tasks"' \
  'display-message -d 2000 "  no .tmux/ tasks in #{session_path}"'

bind w choose-tree -Zw
bind z resize-pane -Z
bind d detach-client

# next-layout, remplaçant du Prefix + Space par défaut (pris par le session
# picker). Seule façon au clavier de rééquilibrer un split.
bind L next-layout


# ─── Copier depuis le terminal ───────────────────────────────

# tmux ne démarre une sélection au cliquer-glisser que si l'application du pane
# n'a PAS demandé les événements souris (`#{mouse_any_flag}` dans son binding
# MouseDrag1Pane par défaut) — Neovim les demande en permanence, Claude Code par
# intermittence, d'où le « des fois ça marche, des fois non ». Dans la table
# copy-mode-vi, MouseDrag1Pane est câblé directement sur begin-selection et
# l'application n'a plus son mot à dire.
#
# Shift + glisser laisse Ghostty faire sa propre sélection, mais Ghostty
# sélectionne par COLONNE d'écran : avec un split vertical on récupère les deux
# panes sur chaque ligne. Le copy-mode respecte les bordures de pane.
bind v copy-mode
bind [ copy-mode

# #{pane_id} est passé explicitement : display-popup s'exécute côté CLIENT, et
# $TMUX_PANE dans le popup ne désigne pas de façon fiable le pane regardé.
bind u display-popup -E -w 80% -h 60% "$HOME/.local/bin/tmux-pick '#{pane_id}'"

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down


# ─── Navigation entre panes : Ctrl+h/j/k/l ───────────────────

# is_vim est le test de vim-tmux-navigator : si le pane fait tourner vim/nvim la
# touche lui est transmise, sinon tmux change de pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Mêmes touches dans le copy-mode : par défaut C-h y est cursor-left (doublon de
# h) et C-j copy-pipe-and-cancel, qui copie et sort du mode.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R


# ─── Extended keys (nécessaire pour Shift+Enter avec ghostty) ──
# tmux décode la séquence CSI u de ghostty, puis le bind renvoie
# la même séquence \x1b[13;2u à l'application (Claude Code, etc.)
set -s extended-keys on
bind -n S-Enter send-keys Escape '[13;2u'


# ─── Status bar ───────────────────────────────────────────────

set -g status-position bottom
# `centre` centre la liste dans l'espace RESTANT après status-left et
# status-right, pas dans le terminal : mesuré sur un client de 120 colonnes,
# allonger status-right de 36 colonnes déplace la liste de 18 vers la gauche.
# Le centrage n'est donc vrai que si les deux blocs font la MÊME largeur — d'où
# les 59 colonnes constantes à droite et le padding correspondant à gauche.
set -g status-justify centre

set -g status-style 'bg=#414559 fg=#a5adce'

# status-left-length est volontairement énorme : la troncature est faite DANS le
# script, parce que celle de tmux s'applique à la chaîne DÉJÀ développée et
# couperait au milieu d'un `#[fg=...]`, imprimant le reste en texte brut.
set -g status-left '#($HOME/.local/bin/tmux-status-left "#{session_path}" "#{session_name}" "#{client_width}")'
set -g status-left-length 200

set -g status-right '#($HOME/.local/bin/tmux-status-right "#{session_path}" "#{client_width}" "#{client_key_table}")'
set -g status-right-length 200

# @task_status est posé par scripts/tmux-task-run.  ● running   ✓ ok   ✗ fail
# Sur la window active le marqueur est la QUEUE de la pilule (glyphe sombre sur
# fond coloré, cap de fermeture assortie) : un ● jaune ou un ✓ vert posé
# directement sur le bleu de la pilule est illisible. Sur les autres il est collé
# à un espace de SON nom, à quatre du suivant, pour lever l'ambiguïté.
# Les capsules  /  (U+E0B6 / U+E0B4) sont la même forme que le bloc de gauche.
setw -g window-status-current-style 'fg=#c6d0f5'
setw -g window-status-current-format '#[bg=#414559,fg=#8caaee]#[bg=#8caaee,fg=#303446,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[nobold]#{?#{==:#{@task_status},running},#[bg=#e5c890#,fg=#303446] ● #[fg=#e5c890],#{?#{==:#{@task_status},ok},#[bg=#a6d189#,fg=#303446] ✓ #[fg=#a6d189],#{?#{==:#{@task_status},fail},#[bg=#e78284#,fg=#303446] ✗ #[fg=#e78284],#[fg=#8caaee]}}}#[bg=#414559]  '

setw -g window-status-style 'fg=#a5adce'
setw -g window-status-format '  #[fg=#737994]#I #{?window_bell_flag,#[fg=#c6d0f5],#[fg=#a5adce]}#W#{?window_zoomed_flag, 󰊓,}#{?#{==:#{@task_status},running},#[fg=#e5c890] ● ,#{?#{==:#{@task_status},ok},#[fg=#a6d189] ✓ ,#{?#{==:#{@task_status},fail},#[fg=#e78284] ✗ ,}}}    '

setw -g window-status-bell-style default
setw -g window-status-activity-style default

setw -g window-status-separator ''

# Claude Code s'installe dans ~/.local/share/claude/versions/<version>, donc
# `pane_current_command` vaut « 2.1.220 » et la window s'appelait comme ça.
# On remappe tout nom qui n'est qu'un numéro de version vers « claude ».
setw -g automatic-rename-format '#{?#{m/r:^[0-9]+(\.[0-9]+)+$,#{pane_current_command}},claude,#{pane_current_command}}'

# ─── Panes ────────────────────────────────────────────────────

set -g pane-border-indicators arrows
set -g pane-border-style 'fg=#51576d'
set -g pane-active-border-style 'fg=#8caaee'

# ─── Messages ─────────────────────────────────────────────────

set -g message-style 'fg=#c6d0f5 bg=#51576d bold'
set -g message-command-style 'fg=#c6d0f5 bg=#51576d'

# ─── Sélection copy mode ─────────────────────────────────────

setw -g mode-style 'fg=#303446 bg=#f4b8e4 bold'


# Le motif est ancré sur '^#' pour que cette ligne-ci ne matche pas elle-même.
bind ? display-popup -w 66 -h 24 "sed -n '/^#   CHEAT SHEET/,/^# ═/p' ~/.tmux.conf | sed 's/^#//'"

# ═══════════════════════════════════════════════════════════════
#   CHEAT SHEET
#
#   Ctrl+a → 1-9   Aller au tab N  (N > count → dernier tab)
#   Ctrl+a → p     Pane mode     d/r = split, x = close, z = zoom, hjkl
#   Ctrl+a → t     Tab mode      n = new, x = close, , = rename, h/l, Tab
#
#   Ctrl+a → u     Attraper une URL / un chemin de l'écran (fzf, sans sélection)
#   Ctrl+a → v     Copy mode — puis sélection À LA SOURIS, relâcher = copié
#                  (Shift + glisser = sélection Ghostty, ignore les splits)
#   Ctrl+a → Space Session picker — trié par usage récent
#   Ctrl+a → e     Task picker — scripts de <projet>/.tmux/
#   Ctrl+a → w     Window picker
#   Ctrl+a → z     Zoom pane
#   Ctrl+a → L     Layout suivant (rééquilibre les splits)
#   Ctrl+a → d     Detach
#   Ctrl+a → r     Reload config
#   Ctrl+a → | -   Split right / down
#
#   Ctrl+hjkl      Naviguer entre panes (direct, sans prefix)
#
#   Dans la barre :  ● tâche en cours   ✓ réussie   ✗ échouée
# ═══════════════════════════════════════════════════════════════
